name: Build production images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact reviewed 40-hex commit selected by this workflow run"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: costmarshal-production-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate reviewed production build inputs
        id: build-inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_production_build_inputs.py \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify reviewed linux-amd64 base manifests
        shell: bash
        env:
          PYTHON_BASE_IMAGE: ${{ steps.build-inputs.outputs.python_base_image }}
          PYTHON_AMD64_MANIFEST: ${{ steps.build-inputs.outputs.python_linux_amd64_manifest }}
          NODE_BASE_IMAGE: ${{ steps.build-inputs.outputs.node_base_image }}
          NODE_AMD64_MANIFEST: ${{ steps.build-inputs.outputs.node_linux_amd64_manifest }}
        run: |
          set -euo pipefail
          verify_manifest() {
            local image="$1"
            local expected="$2"
            local actual
            actual="$(
              docker buildx imagetools inspect --raw "$image" |
                jq -er '
                  [
                    .manifests[]
                    | select(
                        .platform.os == "linux"
                        and .platform.architecture == "amd64"
                        and ((.platform.variant // "") == "")
                      )
                    | .digest
                  ]
                  | if length == 1 then .[0]
                    else error("expected exactly one linux/amd64 manifest")
                    end
                '
            )"
            test "$actual" = "$expected"
          }
          verify_manifest "$PYTHON_BASE_IMAGE" "$PYTHON_AMD64_MANIFEST"
          verify_manifest "$NODE_BASE_IMAGE" "$NODE_AMD64_MANIFEST"
      - name: Validate immutable build inputs and release ref
        shell: bash
        run: |
          set -euo pipefail
          release_pattern='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$GITHUB_REF" == "refs/heads/v4" || "$GITHUB_REF" == refs/tags/v* ]]
          release_version="$(cat VERSION)"
          [[ "$release_version" =~ $release_pattern ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/$release_version"
          fi
      - name: Verify the release source
        shell: bash
        env:
          CODEX_NPM_VERSION: ${{ steps.build-inputs.outputs.codex_npm_version }}
          CODEX_NPM_INTEGRITY: ${{ steps.build-inputs.outputs.codex_npm_integrity }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tmux
          python -m pip install --disable-pip-version-check -r requirements.txt
          test "$(
            node -p 'require("./container/worker/package.json").dependencies["@openai/codex"]'
          )" = "$CODEX_NPM_VERSION"
          test "$(
            node -p 'require("./container/worker/package-lock.json").packages["node_modules/@openai/codex"].integrity'
          )" = "$CODEX_NPM_INTEGRITY"
          npm ci --prefix container/worker --ignore-scripts --include=optional
          export PATH="$PWD/container/worker/node_modules/.bin:$PATH"
          python scripts/sync_plugin_package.py
          python tests/release/run_local_test_evidence.py
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable images
        shell: bash
        env:
          PYTHON_BASE_IMAGE: ${{ steps.build-inputs.outputs.python_base_image }}
          PYTHON_AMD64_MANIFEST: ${{ steps.build-inputs.outputs.python_linux_amd64_manifest }}
          PYTHON_VERSION: ${{ steps.build-inputs.outputs.python_version }}
          NODE_BASE_IMAGE: ${{ steps.build-inputs.outputs.node_base_image }}
          NODE_AMD64_MANIFEST: ${{ steps.build-inputs.outputs.node_linux_amd64_manifest }}
          NODE_VERSION: ${{ steps.build-inputs.outputs.node_version }}
          CODEX_NPM_VERSION: ${{ steps.build-inputs.outputs.codex_npm_version }}
          CODEX_NPM_INTEGRITY: ${{ steps.build-inputs.outputs.codex_npm_integrity }}
          CODEX_NPM_LOCK_SHA256: ${{ steps.build-inputs.outputs.codex_npm_lock_sha256 }}
          BUILD_INPUTS_SHA256: ${{ steps.build-inputs.outputs.build_inputs_sha256 }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          gateway_tag="ghcr.io/${repository}/gateway:sha-${GITHUB_SHA}"
          worker_tag="ghcr.io/${repository}/worker:sha-${GITHUB_SHA}"
          docker buildx create --name costmarshal-release --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build . \
            --file container/gateway/Dockerfile \
            --platform linux/amd64 \
            --build-arg "PYTHON_BASE_IMAGE=$PYTHON_BASE_IMAGE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$gateway_tag" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --metadata-file gateway-metadata.json
          docker buildx build container/worker \
            --file container/worker/Dockerfile \
            --platform linux/amd64 \
            --build-arg "NODE_BASE_IMAGE=$NODE_BASE_IMAGE" \
            --build-arg "CODEX_NPM_VERSION=$CODEX_NPM_VERSION" \
            --build-arg "CODEX_NPM_INTEGRITY=$CODEX_NPM_INTEGRITY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$worker_tag" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --metadata-file worker-metadata.json
          gateway_digest="$(jq -er '."containerimage.digest"' gateway-metadata.json)"
          worker_digest="$(jq -er '."containerimage.digest"' worker-metadata.json)"
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "$gateway_digest" =~ $digest_pattern ]]
          [[ "$worker_digest" =~ $digest_pattern ]]
          gateway_image="${gateway_tag%:*}@$gateway_digest"
          worker_image="${worker_tag%:*}@$worker_digest"
          docker pull "$gateway_image"
          docker pull "$worker_image"
          test "$(docker image inspect "$gateway_image" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "$worker_image" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "$gateway_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$worker_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          observed_python="$(
            docker run --rm --network none --entrypoint python "$gateway_image" \
              -c 'import platform; print(platform.python_version())'
          )"
          observed_node="$(
            docker run --rm --network none --entrypoint node "$worker_image" --version
          )"
          observed_codex="$(
            docker run --rm --network none "$worker_image" codex --version
          )"
          test "$observed_python" = "$PYTHON_VERSION"
          test "$observed_node" = "v$NODE_VERSION"
          grep -F "$CODEX_NPM_VERSION" <<<"$observed_codex"
          GATEWAY_IMAGE="$gateway_image" \
          WORKER_IMAGE="$worker_image" \
          OBSERVED_PYTHON="$observed_python" \
          OBSERVED_NODE="$observed_node" \
          OBSERVED_CODEX="$observed_codex" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema_version": "costmarshal-production-images-v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "release_version": Path("VERSION").read_text(encoding="utf-8").strip(),
              "gateway_image": os.environ["GATEWAY_IMAGE"],
              "worker_image": os.environ["WORKER_IMAGE"],
              "python_base_image": os.environ["PYTHON_BASE_IMAGE"],
              "python_linux_amd64_manifest": os.environ["PYTHON_AMD64_MANIFEST"],
              "python_version": os.environ["PYTHON_VERSION"],
              "node_base_image": os.environ["NODE_BASE_IMAGE"],
              "node_linux_amd64_manifest": os.environ["NODE_AMD64_MANIFEST"],
              "node_version": os.environ["NODE_VERSION"],
              "codex_npm_version": os.environ["CODEX_NPM_VERSION"],
              "codex_npm_integrity": os.environ["CODEX_NPM_INTEGRITY"],
              "codex_npm_lock_sha256": os.environ["CODEX_NPM_LOCK_SHA256"],
              "build_inputs_sha256": os.environ["BUILD_INPUTS_SHA256"],
              "observed_python_version": os.environ["OBSERVED_PYTHON"],
              "observed_node_version": os.environ["OBSERVED_NODE"],
              "observed_codex_version": os.environ["OBSERVED_CODEX"].strip(),
          }
          Path("production-images.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          {
            echo "## Immutable production images"
            echo
            echo "\`$(jq -r .gateway_image production-images.json)\`"
            echo
            echo "\`$(jq -r .worker_image production-images.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the digest receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-images-${{ github.sha }}
          path: production-images.json
          if-no-files-found: error
          retention-days: 30
